<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Teknisi ODC</title>
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
</head>
<body>
  <div id="toastContainer" class="toast-container"></div>
  <div class="header">
    <div style="display: flex; align-items: center; gap: 15px;">
      <img src="logo.png" alt="ODC Logo" style="height: 40px; width: 40px; object-fit: cover; border-radius: 8px;">
      <h1>Portal Teknisi ODC</h1>
    </div>
    <button class="theme-toggle" onclick="toggleTheme()" title="Toggle Dark/Light Mode">🌙</button>
  </div>
  
  <div class="container">
    <div class="form-container">
      <!-- Global Search / Tracking -->
      <div id="historyForm" style="margin-bottom: 25px; padding: 15px; background: rgba(0,0,0,0.02); border: 1px solid var(--border-color); border-radius: 8px;">
        <label style="font-weight: 600; font-size: 14px; margin-bottom: 8px; display: block;">Lacak Tiket / Nama Teknisi</label>
        <div style="display: flex; gap: 10px;">
          <input type="text" id="h_query" placeholder="Masukkan ID Tiket atau Nama" onkeypress="if(event.key === 'Enter') searchHistory()" style="flex: 1; margin: 0; font-size: 14px; padding: 8px 12px;">
          <button type="button" class="btn-submit" id="btn_search_h" onclick="searchHistory()" style="margin: 0; width: auto; padding: 8px 15px; font-size: 14px;">Cari</button>
        </div>
        <div id="h_result" style="margin-top: 15px;"></div>
      </div>

      <div class="tabs">
        <div class="tab active" id="tabBorrow" onclick="switchTab('borrow')">Pinjam Kunci</div>
        <div class="tab" id="tabEvidence" onclick="switchTab('evidence')">Evidence Kegiatan</div>
        <div class="tab" id="tabReturn" onclick="switchTab('return')">Kembalikan Kunci</div>
      </div>

      <div id="loader" class="loader" style="display:none;"></div>

      <!-- Borrow Form -->
      <form id="borrowForm" onsubmit="handleBorrow(event)">
        <div class="form-group">
          <label>Nama Teknisi</label>
          <input type="text" id="b_user" required placeholder="Masukkan nama Anda">
        </div>
        
        <div class="form-group">
          <label>STO</label>
          <select id="b_sto" required onchange="populateOdc('b')">
            <option value="">Pilih STO...</option>
          </select>
        </div>
        
        <div class="form-group">
          <label>ODC</label>
          <select id="b_odc" required>
            <option value="">Pilih ODC...</option>
          </select>
        </div>

        <div class="form-group">
          <label>Nama Kegiatan</label>
          <input type="text" id="b_kegiatan" required placeholder="Contoh: Maintenance / Perbaikan">
        </div>

        <div class="form-group">
          <label>Dasar Kegiatan</label>
          <input type="text" id="b_dasar_kegiatan" required placeholder="Contoh: Tiket IN / Perintah Atasan (Teks Bebas)">
        </div>

        <div class="camera-container" style="margin-bottom: 20px;">
          <label>Foto Evidence Dasar Kegiatan</label>
          <input type="file" id="b_dasar_file" accept="image/*" required style="margin-bottom: 10px; padding: 10px; border: 1px dashed #ccc; border-radius: 8px; width: 100%; box-sizing: border-box;" onchange="handleFileBase64(event, 'b_dasar_evidence', 'b_dasar_status')">
          <input type="hidden" id="b_dasar_evidence" required>
          <p id="b_dasar_status" style="color:green; font-weight:bold; display:none; margin-top: 5px;">File berhasil ditambahkan ✓</p>
        </div>

        <div class="form-group">
          <label>Estimasi Pengerjaan (Jam)</label>
          <input type="number" id="b_estimasi" required min="1" step="1" placeholder="Contoh: 2">
        </div>

        <!-- Camera UI -->
        <div class="camera-container">
          <label>Selfie Evidence</label>
          <video id="b_video" autoplay playsinline></video>
          <canvas id="b_canvas" style="display:none;"></canvas>
          <div>
            <button type="button" class="btn-camera" onclick="startCamera('b')">Buka Kamera</button>
            <button type="button" class="btn-camera" onclick="takePhoto('b')">Ambil Foto</button>
          </div>
          <input type="hidden" id="b_selfie" required>
          <p id="b_photo_status" style="color:green; font-weight:bold; display:none;">Foto berhasil diambil ✓</p>
        </div>

        <button type="submit" class="btn-submit" id="btn_submit_b">Submit Peminjaman</button>
      </form>

      <!-- Return Form -->
      <form id="returnForm" style="display:none;" onsubmit="handleReturn(event)">
        <div class="form-group">
          <label>STO</label>
          <select id="r_sto" required onchange="populateOdc('r')">
            <option value="">Pilih STO...</option>
          </select>
        </div>
        
        <div class="form-group">
          <label>ODC yang Dipinjam</label>
          <select id="r_odc" required>
            <option value="">Pilih ODC...</option>
          </select>
        </div>

        <!-- Camera UI -->
        <div class="camera-container">
          <label>Selfie Evidence Pengembalian</label>
          <video id="r_video" autoplay playsinline></video>
          <canvas id="r_canvas" style="display:none;"></canvas>
          <div>
            <button type="button" class="btn-camera" onclick="startCamera('r')">Buka Kamera</button>
            <button type="button" class="btn-camera" onclick="takePhoto('r')">Ambil Foto</button>
          </div>
          <input type="hidden" id="r_selfie" required>
          <p id="r_photo_status" style="color:green; font-weight:bold; display:none;">Foto berhasil diambil ✓</p>
        </div>

        <button type="submit" class="btn-submit" id="btn_submit_r">Submit Pengembalian</button>
      </form>
      
      <!-- Evidence Form -->
      <form id="evidenceForm" style="display:none;" onsubmit="handleEvidence(event)">
        <div class="form-group" style="background: rgba(37, 99, 235, 0.05); padding: 15px; border-radius: 8px; border: 1px dashed var(--primary-color);">
          <label style="color: var(--primary-color);">ID Tiket Peminjaman</label>
          <div style="display: flex; gap: 10px;">
            <input type="text" id="e_ticket_id" placeholder="Cth: BGL1" style="flex: 1; margin: 0; font-size: 14px; padding: 8px 12px;">
            <button type="button" class="btn-submit" onclick="autofillEvidence(this)" style="margin: 0; width: auto; padding: 8px 15px; font-size: 14px;">Isi Otomatis</button>
          </div>
          <small style="color:var(--text-muted); display:block; margin-top:8px;">Masukkan ID Tiket untuk otomatis mengisi Nama, STO, ODC, dan Detail Kegiatan.</small>
        </div>

        <div class="form-group">
          <label>Nama Teknisi</label>
          <input type="text" id="e_user" required placeholder="Masukkan nama Anda">
        </div>

        <div class="form-group">
          <label>STO</label>
          <select id="e_sto" required onchange="populateOdc('e')">
            <option value="">Pilih STO...</option>
          </select>
        </div>
        
        <div class="form-group">
          <label>ODC</label>
          <select id="e_odc" required>
            <option value="">Pilih ODC...</option>
          </select>
        </div>

        <div class="form-group">
          <label>Detail Kegiatan</label>
          <input type="text" id="e_kegiatan" required placeholder="Contoh: Perbaikan port / Tarik kabel">
        </div>

        <!-- Camera UI -->
        <div class="camera-container">
          <label>Foto Evidence</label>
          <video id="e_video" autoplay playsinline></video>
          <canvas id="e_canvas" style="display:none;"></canvas>
          <div>
            <button type="button" class="btn-camera" onclick="startCamera('e')">Buka Kamera</button>
            <button type="button" class="btn-camera" onclick="takePhoto('e')">Ambil Foto</button>
          </div>
          <input type="hidden" id="e_selfie" required>
          <p id="e_photo_status" style="color:green; font-weight:bold; display:none;">Foto berhasil diambil ✓</p>
        </div>

        <button type="submit" class="btn-submit" id="btn_submit_e">Submit Evidence</button>
      </form>

    </div>
  </div>

  <script>
    // Theme logic
    const currentTheme = localStorage.getItem('theme') || 'light';
    if (currentTheme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');

    function toggleTheme() {
      let theme = document.documentElement.getAttribute('data-theme');
      theme = (theme === 'dark') ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('theme', theme);
      updateThemeIcon(theme);
    }
    
    function updateThemeIcon(theme) {
      const btn = document.querySelector('.theme-toggle');
      if (btn) btn.innerText = theme === 'dark' ? '☀️' : '🌙';
    }

    let masterData = {};
    let currentStream = null;

    document.addEventListener("DOMContentLoaded", function() {
      updateThemeIcon(currentTheme);
      fetchMasterData();
    });

    async function fetchMasterData() {
      document.getElementById('loader').style.display = 'block';
      try {
        const res = await fetch(API_URL + '?action=getMasterData');
        masterData = await res.json();
        populateSto('b');
        populateSto('r');
        populateSto('e');
      } catch (e) {
        console.error(e);
        alert('Gagal mengambil data master');
      }
      document.getElementById('loader').style.display = 'none';
    }

    function switchTab(tab) {
      if(currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
        currentStream = null;
      }
      
      const forms = ['borrow', 'evidence', 'return'];
      forms.forEach(f => {
        const tabEl = document.getElementById('tab' + f.charAt(0).toUpperCase() + f.slice(1));
        const formEl = document.getElementById(f + 'Form');
        
        if (f === tab) {
          tabEl.classList.add('active');
          formEl.style.display = 'block';
        } else {
          tabEl.classList.remove('active');
          formEl.style.display = 'none';
        }
      });
    }

    function populateSto(prefix) {
      const select = document.getElementById(prefix + '_sto');
      select.innerHTML = '<option value="">Pilih STO...</option>';
      
      for (const sto in masterData) {
        const opt = document.createElement('option');
        opt.value = sto;
        opt.innerText = sto;
        select.appendChild(opt);
      }
    }

    function populateOdc(prefix) {
      const stoName = document.getElementById(prefix + '_sto').value;
      const select = document.getElementById(prefix + '_odc');
      select.innerHTML = '<option value="">Pilih ODC...</option>';
      
      if (stoName && masterData[stoName]) {
        masterData[stoName].forEach(odc => {
          const opt = document.createElement('option');
          opt.value = odc;
          opt.innerText = odc;
          select.appendChild(opt);
        });
      }
    }

    // Camera Logic
    async function startCamera(prefix) {
      const video = document.getElementById(prefix + '_video');
      if(currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }
      
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
        video.style.display = 'block';
        document.getElementById(prefix + '_canvas').style.display = 'none';
        video.srcObject = stream;
        currentStream = stream;
      } catch (err) {
        alert('Gagal mengakses kamera: ' + err.message);
      }
    }

    function takePhoto(prefix) {
      const video = document.getElementById(prefix + '_video');
      const canvas = document.getElementById(prefix + '_canvas');
      const input = document.getElementById(prefix + '_selfie');
      const status = document.getElementById(prefix + '_photo_status');

      if(!currentStream) {
        alert('Buka kamera terlebih dahulu!');
        return;
      }

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);
      
      const dataUrl = canvas.toDataURL('image/png');
      input.value = dataUrl;
      
      video.style.display = 'none';
      canvas.style.display = 'block';
      status.style.display = 'block';

      currentStream.getTracks().forEach(track => track.stop());
      currentStream = null;
    }

    function handleFileBase64(event, hiddenInputId, statusId) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById(hiddenInputId).value = e.target.result;
          document.getElementById(statusId).style.display = 'block';
        };
        reader.readAsDataURL(file);
      } else {
        document.getElementById(hiddenInputId).value = '';
        document.getElementById(statusId).style.display = 'none';
      }
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = 'toast ' + (type === 'error' ? 'error' : '');
      toast.innerHTML = (type === 'success' ? '✅ ' : '❌ ') + message;
      
      container.appendChild(toast);
      
      setTimeout(() => {
        toast.style.animation = 'fadeOut 0.3s ease-out forwards';
        setTimeout(() => {
          toast.remove();
        }, 300);
      }, 4000);
    }

    async function handleBorrow(e) {
      e.preventDefault();
      
      const selfie = document.getElementById('b_selfie').value;
      if(!selfie) {
        showToast('Silakan ambil foto selfie terlebih dahulu!', 'error');
        return;
      }
      
      const dasarEvidence = document.getElementById('b_dasar_evidence').value;
      if(!dasarEvidence) {
        showToast('Silakan lampirkan foto evidence dasar kegiatan!', 'error');
        return;
      }

      const payload = {
        user: document.getElementById('b_user').value,
        sto: document.getElementById('b_sto').value,
        odc: document.getElementById('b_odc').value,
        kegiatan: document.getElementById('b_kegiatan').value,
        dasarKegiatan: document.getElementById('b_dasar_kegiatan').value,
        estimasi: document.getElementById('b_estimasi').value,
        selfie: selfie,
        dasarEvidence: dasarEvidence
      };

      const btn = document.getElementById('btn_submit_b');
      btn.disabled = true;
      btn.innerText = 'Mengirim...';

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'submitBorrow', payload: payload })
        });
        const data = await res.json();
        
        if (data.success) {
          showToast(`Berhasil! ID Tiket: ${data.id}`);
          alert(`PEMINJAMAN BERHASIL!\n\nID Tiket Anda: ${data.id}\nSimpan ID ini untuk melacak status peminjaman pada tab "Riwayat Tiket".`);
          document.getElementById('borrowForm').reset();
          document.getElementById('b_photo_status').style.display = 'none';
          document.getElementById('b_canvas').style.display = 'none';
          
          const alarmMs = parseInt(payload.estimasi) * 60 * 60 * 1000;
          setTimeout(() => {
            alert(`ALARM PENGEMBALIAN!\nKunci ODC ${payload.odc} waktu peminjaman (${payload.estimasi} Jam) telah habis. Silakan kembalikan kunci!`);
          }, alarmMs);
        } else {
          showToast('Gagal meminjam kunci: ' + (data.message || 'Error'), 'error');
        }
      } catch (err) {
        console.error(err);
        showToast('Terjadi kesalahan saat mengirim data.', 'error');
      }
      
      btn.disabled = false;
      btn.innerText = 'Submit Peminjaman';
    }

    async function handleReturn(e) {
      e.preventDefault();
      
      const selfie = document.getElementById('r_selfie').value;
      if(!selfie) {
        showToast('Silakan ambil foto selfie pengembalian terlebih dahulu!', 'error');
        return;
      }

      const payload = {
        sto: document.getElementById('r_sto').value,
        odc: document.getElementById('r_odc').value,
        selfie: selfie
      };

      const btn = document.getElementById('btn_submit_r');
      btn.disabled = true;
      btn.innerText = 'Mengirim...';

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'submitReturn', payload: payload })
        });
        const data = await res.json();
        
        if (data.success) {
          showToast(`Sukses! Kunci ODC ${payload.odc} telah dikembalikan.`);
          alert(`PENGEMBALIAN BERHASIL!\n\nKunci ODC ${payload.odc} telah berhasil dikembalikan.`);
          document.getElementById('returnForm').reset();
          document.getElementById('r_photo_status').style.display = 'none';
          document.getElementById('r_canvas').style.display = 'none';
        } else {
          showToast('Gagal: ' + (data.message || 'Error'), 'error');
        }
      } catch (err) {
        console.error(err);
        showToast('Terjadi kesalahan saat mengirim data.', 'error');
      }

      btn.disabled = false;
      btn.innerText = 'Submit Pengembalian';
    }

    async function handleEvidence(e) {
      e.preventDefault();
      
      const selfie = document.getElementById('e_selfie').value;
      if(!selfie) {
        showToast('Silakan ambil foto evidence terlebih dahulu!', 'error');
        return;
      }

      const payload = {
        user: document.getElementById('e_user').value,
        sto: document.getElementById('e_sto').value,
        odc: document.getElementById('e_odc').value,
        kegiatan: document.getElementById('e_kegiatan').value,
        selfie: selfie
      };

      const btn = document.getElementById('btn_submit_e');
      btn.disabled = true;
      btn.innerText = 'Mengirim...';

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'submitEvidence', payload: payload })
        });
        const data = await res.json();
        
        if (data.success) {
          showToast(`Sukses! Evidence terkirim. ID Tiket: ${data.id}`);
          alert(`EVIDENCE BERHASIL TERKIRIM!\n\nID Tiket Anda: ${data.id}\nSimpan ID ini sebagai bukti laporan Anda.`);
          document.getElementById('evidenceForm').reset();
          document.getElementById('e_photo_status').style.display = 'none';
          document.getElementById('e_canvas').style.display = 'none';
        } else {
          showToast('Gagal: ' + (data.message || 'Error'), 'error');
        }
      } catch (err) {
        console.error(err);
        showToast('Terjadi kesalahan saat mengirim data.', 'error');
      }

      btn.disabled = false;
      btn.innerText = 'Submit Evidence';
    }

    async function autofillEvidence(btn) {
      const ticketId = document.getElementById('e_ticket_id').value.trim().toLowerCase();
      if (!ticketId) {
        showToast('Masukkan ID Tiket terlebih dahulu!', 'error');
        return;
      }
      
      const originalText = btn.innerText;
      btn.innerText = 'Mencari...';
      btn.disabled = true;

      try {
        const res = await fetch(API_URL + '?action=getTechnicianHistory&query=' + encodeURIComponent(ticketId));
        const data = await res.json();
        
        let ticket = null;
        if (data.active) ticket = data.active.find(t => t.id.toLowerCase() === ticketId);
        if (!ticket && data.history) ticket = data.history.find(t => t.id.toLowerCase() === ticketId);

        if (ticket) {
          document.getElementById('e_user').value = ticket.user;
          document.getElementById('e_sto').value = ticket.sto;
          populateOdc('e'); 
          
          setTimeout(() => {
            document.getElementById('e_odc').value = ticket.odc;
            document.getElementById('e_kegiatan').value = ticket.kegiatan;
          }, 50);

          showToast('Data berhasil diisi otomatis!', 'success');
        } else {
          showToast('Tiket tidak ditemukan!', 'error');
        }
      } catch (err) {
        console.error(err);
        showToast('Gagal mencari tiket.', 'error');
      }

      btn.innerText = originalText;
      btn.disabled = false;
    }

    async function searchHistory() {
      const query = document.getElementById('h_query').value.trim();
      if (!query) {
        showToast('Masukkan kata pencarian terlebih dahulu!', 'error');
        return;
      }
      
      const btn = document.getElementById('btn_search_h');
      const resultDiv = document.getElementById('h_result');
      
      btn.disabled = true;
      btn.innerText = 'Mencari...';
      resultDiv.innerHTML = '<div class="loader" style="display:block; margin: 20px auto;"></div>';
      
      try {
        const res = await fetch(API_URL + '?action=getTechnicianHistory&query=' + encodeURIComponent(query));
        const data = await res.json();
        
        let html = '';
        
        if (data.active && data.active.length > 0) {
          html += '<h3 style="margin-top:0;">Sedang Dipinjam</h3><ul style="list-style-type:none; padding:0;">';
          data.active.forEach(item => {
            html += `
              <li style="background:var(--glass-bg); padding:20px; border-radius:12px; margin-bottom:15px; border:1px solid var(--primary-color); box-shadow:0 4px 6px rgba(0,0,0,0.05);">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                  <strong style="font-size:16px;">${item.odc} (${item.sto})</strong>
                  <span style="background:var(--primary-color); color:#fff; padding:4px 8px; border-radius:6px; font-size:12px; font-weight:bold;">ID: ${item.id}</span>
                </div>
                
                <div class="stepper-wrapper">
                  <div class="stepper-item completed">
                    <div class="stepper-icon">✓</div>
                    <p>Dipinjam</p>
                  </div>
                  <div class="stepper-item active">
                    <div class="stepper-icon">...</div>
                    <p>Pengerjaan</p>
                  </div>
                  <div class="stepper-item">
                    <div class="stepper-icon">3</div>
                    <p>Dikembalikan</p>
                  </div>
                </div>

                <div style="font-size:13px; line-height: 1.6; color:var(--text-main); border-top:1px solid var(--glass-border); padding-top:12px;">
                  <div style="display:flex; justify-content:space-between;"><span>Teknisi:</span> <strong>${item.user}</strong></div>
                  <div style="display:flex; justify-content:space-between;"><span>Kegiatan:</span> <strong>${item.kegiatan}</strong></div>
                  <div style="display:flex; justify-content:space-between;"><span>Waktu Pinjam:</span> <strong>${item.waktuPinjam}</strong></div>
                </div>
              </li>
            `;
          });
          html += '</ul>';
        }
        
        if (data.history && data.history.length > 0) {
          html += '<h3>Riwayat Pengembalian</h3><ul style="list-style-type:none; padding:0;">';
          data.history.forEach(item => {
            html += `
              <li style="background:var(--glass-bg); padding:20px; border-radius:12px; margin-bottom:15px; border:1px solid var(--green-status); box-shadow:0 4px 6px rgba(0,0,0,0.05);">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                  <strong style="font-size:16px;">${item.odc} (${item.sto})</strong>
                  <span style="background:var(--green-status); color:#fff; padding:4px 8px; border-radius:6px; font-size:12px; font-weight:bold;">ID: ${item.id}</span>
                </div>
                
                <div class="stepper-wrapper">
                  <div class="stepper-item completed-green">
                    <div class="stepper-icon">✓</div>
                    <p>Dipinjam</p>
                  </div>
                  <div class="stepper-item completed-green">
                    <div class="stepper-icon">✓</div>
                    <p>Pengerjaan</p>
                  </div>
                  <div class="stepper-item completed-green">
                    <div class="stepper-icon">✓</div>
                    <p>Dikembalikan</p>
                  </div>
                </div>

                <div style="font-size:13px; line-height: 1.6; color:var(--text-main); border-top:1px solid var(--glass-border); padding-top:12px;">
                  <div style="display:flex; justify-content:space-between;"><span>Teknisi:</span> <strong>${item.user}</strong></div>
                  <div style="display:flex; justify-content:space-between;"><span>Kegiatan:</span> <strong>${item.kegiatan}</strong></div>
                  <div style="display:flex; justify-content:space-between;"><span>Waktu Pinjam:</span> <strong>${item.waktuPinjam}</strong></div>
                  <div style="display:flex; justify-content:space-between;"><span>Kembali:</span> <strong>${item.waktuKembali}</strong></div>
                </div>
              </li>
            `;
          });
          html += '</ul>';
        }
        
        if (html === '') {
          html = '<p style="text-align:center; color:#666; padding:20px; background:#f9f9f9; border-radius:8px;">Tidak ada riwayat yang ditemukan untuk nama / ID tiket tersebut.</p>';
        }
        
        resultDiv.innerHTML = html;
        
      } catch (err) {
        console.error(err);
        resultDiv.innerHTML = '<p style="color:red; text-align:center;">Gagal mengambil data riwayat. Silakan coba lagi.</p>';
      }
      
      btn.disabled = false;
      btn.innerText = 'Cari Riwayat';
    }
  </script>
</body>
</html>

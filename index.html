<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O-Key - Dashboard</title>
  <link rel="icon" type="image/png" href="logo.png?v=2">
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
</head>
<body>
  <div class="header">
    <div style="display: flex; align-items: center; gap: 15px;">
      <img src="logo.png?v=2" alt="ODC Logo" style="height: 40px; width: 40px; object-fit: cover; border-radius: 8px;">
      <h1>O-Key Dashboard</h1>
    </div>
    <button class="theme-toggle" onclick="toggleTheme()" title="Toggle Dark/Light Mode">🌙</button>
  </div>
  
  <div class="container">
    <div id="loader" class="loader"></div>
    
    <div id="dashboard" class="sa-container" style="display:none;">
      <!-- SA Sections injected here -->
    </div>
    
    <div id="stoDetailView" style="display:none;">
      <button onclick="backToDashboard()" style="margin-bottom: 20px; padding: 10px 15px; cursor:pointer; background:var(--primary-color); color:white; border:none; border-radius:5px; font-weight:bold;">&larr; Kembali ke Dashboard</button>
      <h2 id="stoDetailTitle" style="margin-bottom: 10px;"></h2>
      
      <div id="stoAlertContainer" style="margin-bottom: 20px;"></div>
      
      <div class="sa-section" style="background:var(--card-bg);">
        <div id="stoDetailGrid" class="dashboard-grid">
          <!-- ODC Icons injected here -->
        </div>
      </div>
      
      <!-- ODC History Section -->
      <div id="odcHistorySection" style="display:none; margin-top: 30px; background: var(--card-bg); padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
        <h2 id="odcHistoryTitle" style="margin-top:0; border-bottom: 2px solid var(--border-color); padding-bottom: 10px;">Riwayat ODC</h2>
        <div style="overflow-x: auto;">
          <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 13px;">
            <thead>
              <tr style="background: #8cc63f; color: white; border-bottom: 2px solid #ddd;">
                <th style="padding: 10px;">#</th>
                <th style="padding: 10px;">Start</th>
                <th style="padding: 10px;">Close</th>
                <th style="padding: 10px;">Durasi</th>
                <th style="padding: 10px;">Kode</th>
                <th style="padding: 10px;">Pekerjaan</th>
                <th style="padding: 10px;">User</th>
                <th style="padding: 10px;">Aksi</th>
              </tr>
            </thead>
            <tbody id="odcHistoryTableBody">
            </tbody>
          </table>
        </div>
      </div>
    </div>
    
    <div id="activeBorrowingsSection" style="display:none; margin-top: 40px; background: var(--card-bg); padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
      <h2 style="margin-top:0; border-bottom: 2px solid var(--border-color); padding-bottom: 10px;">REPOSITORY ACTIVITY</h2>
      <div style="overflow-x: auto;">
        <table style="width: 100%; border-collapse: collapse; text-align: left;">
          <thead>
            <tr style="background: #f5f5f5; border-bottom: 2px solid #ddd;">
              <th style="padding: 10px;">STO</th>
              <th style="padding: 10px;">ODC</th>
              <th style="padding: 10px;">Teknisi</th>
              <th style="padding: 10px;">Kegiatan</th>
              <th style="padding: 10px;">Dasar Kegiatan</th>
              <th style="padding: 10px;">Waktu Pinjam</th>
              <th style="padding: 10px;">Estimasi</th>
            </tr>
          </thead>
          <tbody id="activeBorrowingsTableBody">
            <!-- Active rows injected here -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- History Modal -->
  <div id="historyModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <h2 id="modalTitle">History Kunci</h2>
      <div id="modalBody">
        <!-- History details injected here -->
      </div>
    </div>
  </div>

  <script>
    // Theme logic
    const currentTheme = localStorage.getItem('theme') || 'light';
    if (currentTheme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');

    function toggleTheme() {
      let theme = document.documentElement.getAttribute('data-theme');
      theme = (theme === 'dark') ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('theme', theme);
      updateThemeIcon(theme);
    }
    
    function updateThemeIcon(theme) {
      const btn = document.querySelector('.theme-toggle');
      if (btn) btn.innerText = theme === 'dark' ? '☀️' : '🌙';
    }
    
    document.addEventListener("DOMContentLoaded", function() {
      updateThemeIcon(currentTheme);
      fetchDashboardData();
    });

    async function fetchDashboardData() {
      try {
        const response = await fetch(API_URL + '?action=getDashboardData');
        const data = await response.json();
        renderDashboard(data);
      } catch (err) {
        console.error('Error fetching dashboard:', err);
        const dashboard = document.getElementById('dashboard');
        if (dashboard.innerHTML.trim() === '') {
          document.getElementById('loader').style.display = 'none';
          dashboard.style.display = 'block';
          dashboard.innerHTML = '<div style="text-align:center; padding: 30px; color: var(--red-status);">Gagal terhubung ke database Google Sheets.<br>Mencoba ulang dalam 5 detik...</div>';
          setTimeout(fetchDashboardData, 5000);
        }
      }
    }

    function renderDashboard(data) {
      window.dashboardData = data; // Save for sub-page usage
      document.getElementById('loader').style.display = 'none';
      
      const dashboard = document.getElementById('dashboard');
      const activeSection = document.getElementById('activeBorrowingsSection');
      const stoDetailView = document.getElementById('stoDetailView');
      const isDetailViewOpen = stoDetailView.style.display === 'block';
      
      if (!isDetailViewOpen) {
        dashboard.style.display = 'grid';
      }
      dashboard.innerHTML = '';
      
      let activeBorrowingsList = [];
      
      for (const saName in data) {
        const sa = data[saName];
        
        const saSection = document.createElement('div');
        saSection.className = 'sa-section';
        saSection.innerHTML = `<h2 class="sa-title">Service Area: ${sa.name}</h2>`;
        
        const saGrid = document.createElement('div');
        saGrid.className = 'dashboard-grid';
        
        for (const stoName in sa.stos) {
          const sto = sa.stos[stoName];
          
          sto.odcs.forEach(odc => {
            if (odc.status === 'red' && odc.borrowDetails) {
              activeBorrowingsList.push(odc.borrowDetails);
            }
          });
          
          let iconColor = sto.status === 'red' ? '#d9534f' : '#8cc63f';
          let iconSvg = `
            <svg width="28" height="28" viewBox="0 0 24 24" fill="${iconColor}" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
              <line x1="8" y1="21" x2="16" y2="21"></line>
              <line x1="12" y1="17" x2="12" y2="21"></line>
              <rect x="6" y="6" width="12" height="8" fill="#fff" stroke="none"></rect>
            </svg>`;

          const stoCard = document.createElement('div');
          stoCard.className = `odc-item status-${sto.status}`;
          stoCard.innerHTML = `
            <div class="monitor-icon">${iconSvg}</div>
            <div style="font-size:10px; font-weight:bold; margin-top:5px; color:#333; text-align:center;">${sto.name}</div>
          `;
          stoCard.onclick = (e) => handleStoClick(e, sto.name, sa.name);
          
          saGrid.appendChild(stoCard);
        }
        
        saSection.appendChild(saGrid);
        dashboard.appendChild(saSection);
      }
      
      // Render active borrowings table
      const tableBody = document.getElementById('activeBorrowingsTableBody');
      const activeSection = document.getElementById('activeBorrowingsSection');
      tableBody.innerHTML = '';
      
      if (activeBorrowingsList.length > 0) {
        if (!isDetailViewOpen) activeSection.style.display = 'block';
        activeBorrowingsList.forEach(b => {
          const row = document.createElement('tr');
          row.style.borderBottom = '1px solid #eee';
          row.innerHTML = `
            <td style="padding: 10px;"><strong>${b.sto}</strong></td>
            <td style="padding: 10px;">${b.odc}</td>
            <td style="padding: 10px;">${b.user}</td>
            <td style="padding: 10px;">${b.kegiatan}</td>
            <td style="padding: 10px;">${b.dasarKegiatan || '-'}</td>
            <td style="padding: 10px;">${b.waktuPinjam}</td>
            <td style="padding: 10px;">${b.estimasi} Jam</td>
          `;
          tableBody.appendChild(row);
        });
      } else {
        if (!isDetailViewOpen) activeSection.style.display = 'block';
        tableBody.innerHTML = '<tr><td colspan="6" style="padding: 10px; text-align:center; color:#666;">Tidak ada kunci yang sedang dipinjam saat ini.</td></tr>';
      }
      
      if (isDetailViewOpen && window.currentStoName && window.currentSaName) {
        handleStoClick({stopPropagation: () => {}}, window.currentStoName, window.currentSaName);
      }
    }

    function handleStoClick(event, stoName, saName) {
      if (event && event.stopPropagation) event.stopPropagation();
      window.currentStoName = stoName;
      window.currentSaName = saName;
      document.getElementById('dashboard').style.display = 'none';
      document.getElementById('activeBorrowingsSection').style.display = 'none';
      document.getElementById('stoDetailView').style.display = 'block';
      document.getElementById('stoDetailTitle').innerText = `Detail STO: ${stoName} (Service Area: ${saName})`;
      
      const stoDetailGrid = document.getElementById('stoDetailGrid');
      stoDetailGrid.innerHTML = '';
      
      const alertContainer = document.getElementById('stoAlertContainer');
      alertContainer.innerHTML = '';
      if (window.stoTimerInterval) {
        clearInterval(window.stoTimerInterval);
      }
      
      const sto = window.dashboardData[saName].stos[stoName];
      let activeOdcs = [];
      
      sto.odcs.forEach(odc => {
        if (odc.status === 'red' && odc.borrowDetails) {
          activeOdcs.push({ name: odc.name, details: odc.borrowDetails });
        }
        let borrowData = odc.borrowDetails ? JSON.stringify(odc.borrowDetails) : '{}';
        let borrowDataStr = btoa(encodeURIComponent(borrowData));
        
        let iconColor = odc.status === 'red' ? '#d9534f' : '#8cc63f';
        let iconSvg = `
          <svg width="18" height="18" viewBox="0 0 24 24" fill="${iconColor}" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
            <rect x="6" y="6" width="12" height="8" fill="#fff" stroke="none"></rect>
          </svg>`;

        const odcCard = document.createElement('div');
        odcCard.className = `odc-item status-${odc.status}`;
        odcCard.title = odc.name;
        odcCard.onclick = (e) => handleOdcClick(e, odc.name, odc.status, borrowDataStr);
        odcCard.innerHTML = `
          <div class="monitor-icon">${iconSvg}</div>
          <div style="font-size:8px; font-weight:bold; margin-top:2px; color:#333; text-align:center; max-width:60px; word-wrap:break-word;">${odc.name.split('-').pop()}</div>
        `;
        stoDetailGrid.appendChild(odcCard);
      });

      if (activeOdcs.length > 0) {
        let alertHtml = '';
        activeOdcs.forEach((item, index) => {
          alertHtml += `
            <div style="background: rgba(220, 53, 69, 0.1); border-left: 4px solid var(--red-status); padding: 12px 15px; margin-bottom: 10px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; font-size: 14px;">
              <div>
                <strong>${item.name}</strong> dipinjam oleh <strong>${item.details.user}</strong>
              </div>
              <div id="timer-${index}" style="font-family: monospace; font-size: 16px; font-weight: bold; color: var(--red-status);">
                Menghitung...
              </div>
            </div>
          `;
        });
        alertContainer.innerHTML = alertHtml;
        
        window.stoTimerInterval = setInterval(() => {
          activeOdcs.forEach((item, index) => {
            let timerEl = document.getElementById(`timer-${index}`);
            if (timerEl) {
              let borrowDate = parseDateString(item.details.waktuPinjam);
              let estimasi = parseFloat(item.details.estimasi) || 0;
              let dueDate = new Date(borrowDate.getTime() + estimasi * 60 * 60 * 1000);
              let now = new Date();
              
              let diff = dueDate - now;
              let isOverdue = diff < 0;
              if (isOverdue) diff = Math.abs(diff);
              
              let h = Math.floor(diff / (1000 * 60 * 60));
              let m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
              let s = Math.floor((diff % (1000 * 60)) / 1000);
              
              let timeStr = `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
              
              if (isOverdue) {
                timerEl.innerHTML = `⚠️ Lewat Batas Waktu: ${timeStr}`;
                timerEl.style.color = '#dc3545';
              } else {
                timerEl.innerHTML = `⏳ Sisa Waktu: ${timeStr}`;
                timerEl.style.color = '#d97706';
              }
            }
          });
        }, 1000);
      }
    }

    function parseDateString(dateStr) {
      if (!dateStr || dateStr.includes('Invalid')) return new Date();
      try {
        let cleanStr = dateStr.replace(',', '');
        let parts = cleanStr.split(/[\s,T]+/);
        if (parts.length < 2) return new Date(cleanStr);
        
        let dateParts = parts[0].split(/[\/\-]/);
        let timeParts = parts[1].split(/[:.]/);
        
        if (dateParts.length === 3 && timeParts.length >= 2) {
          let day = parseInt(dateParts[0], 10);
          let month = parseInt(dateParts[1], 10) - 1;
          let year = parseInt(dateParts[2], 10);
          if (year < 100) year += 2000;
          if (dateParts[0].length === 4) { // YYYY-MM-DD
             year = parseInt(dateParts[0], 10);
             month = parseInt(dateParts[1], 10) - 1;
             day = parseInt(dateParts[2], 10);
          }
          
          let hour = parseInt(timeParts[0], 10);
          let min = parseInt(timeParts[1], 10);
          let sec = timeParts.length > 2 ? parseInt(timeParts[2], 10) : 0;
          
          return new Date(year, month, day, hour, min, sec);
        }
        return new Date(dateStr);
      } catch (e) {
        return new Date();
      }
    }

    function backToDashboard() {
      if (window.stoTimerInterval) clearInterval(window.stoTimerInterval);
      window.currentStoName = null;
      window.currentSaName = null;
      document.getElementById('stoDetailView').style.display = 'none';
      document.getElementById('dashboard').style.display = 'grid';
      if (document.getElementById('activeBorrowingsTableBody').children.length > 0) {
        document.getElementById('activeBorrowingsSection').style.display = 'block';
      }
    }

    async function handleOdcClick(event, odcName, status, borrowDataStr) {
      if (event && event.stopPropagation) event.stopPropagation();
      
      const historySection = document.getElementById('odcHistorySection');
      const title = document.getElementById('odcHistoryTitle');
      const tbody = document.getElementById('odcHistoryTableBody');
      
      historySection.style.display = 'block';
      title.innerText = `LOG ${odcName}`;
      tbody.innerHTML = '<tr><td colspan="8" style="padding: 10px; text-align:center;"><div class="loader" style="margin:auto;"></div></td></tr>';
      
      let activeRowHtml = '';
      if (status === 'red') {
        const data = JSON.parse(decodeURIComponent(atob(borrowDataStr)));
        const borrowDate = parseDateString(data.waktuPinjam);
        const estimasi = parseFloat(data.estimasi) || 0;
        const dueDate = new Date(borrowDate.getTime() + estimasi * 60 * 60 * 1000);
        const diff = dueDate - new Date();
        const isOverdue = diff < 0;
        const absDiff = Math.abs(diff);
        const h = Math.floor(absDiff / (1000 * 60 * 60));
        const m = Math.floor((absDiff % (1000 * 60 * 60)) / (1000 * 60));
        const s = Math.floor((absDiff % (1000 * 60)) / 1000);
        const timeStr = `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        
        let durasiHtml = `<span style="color: ${isOverdue ? 'var(--red-status)' : 'var(--primary-color)'}; font-weight:bold;">${isOverdue ? '-' : ''}${timeStr} (Sisa)</span>`;
        
        activeRowHtml = `
          <tr style="background: rgba(220, 53, 69, 0.05); border-bottom: 1px solid #ddd;">
            <td style="padding: 10px;">1</td>
            <td style="padding: 10px;">${data.waktuPinjam}</td>
            <td style="padding: 10px;">-</td>
            <td style="padding: 10px;">${durasiHtml}</td>
            <td style="padding: 10px; font-weight:bold; color:var(--primary-color);">${odcName}</td>
            <td style="padding: 10px;">${data.kegiatan}</td>
            <td style="padding: 10px;">${data.user}</td>
            <td style="padding: 10px;">
              ${data.selfiePinjam ? `<a href="${data.selfiePinjam}" target="_blank" style="color:var(--primary-color); text-decoration:none;">📷 Selfie</a>` : ''}
              ${data.dasarEvidence ? `<br><a href="${data.dasarEvidence}" target="_blank" style="color:var(--primary-color); text-decoration:none;">📄 Evidence</a>` : ''}
            </td>
          </tr>
        `;
      }
      
      fetchHistory(odcName, activeRowHtml);
    }

    async function fetchHistory(odcName, activeRowHtml = '') {
      try {
        const response = await fetch(API_URL + '?action=getOdcHistory&odc=' + encodeURIComponent(odcName));
        const historyList = await response.json();
        renderHistory(odcName, historyList, activeRowHtml);
      } catch (err) {
        document.getElementById('odcHistoryTableBody').innerHTML = '<tr><td colspan="8" style="text-align:center; color:red;">Gagal mengambil riwayat.</td></tr>';
      }
    }

    function renderHistory(odcName, historyList, activeRowHtml) {
      const tbody = document.getElementById('odcHistoryTableBody');
      let html = activeRowHtml;
      
      let index = activeRowHtml ? 2 : 1;
      
      if (historyList.length === 0 && !activeRowHtml) {
        tbody.innerHTML = '<tr><td colspan="8" style="padding: 10px; text-align:center; color:#666;">Belum ada riwayat peminjaman untuk ODC ini.</td></tr>';
        return;
      }
      
      historyList.forEach(h => {
        const borrowDate = parseDateString(h.waktuPinjam);
        const returnDate = parseDateString(h.waktuKembali);
        let durasiHtml = '-';
        if (borrowDate.getTime() > 0 && returnDate.getTime() > 0) {
          const diff = returnDate - borrowDate;
          if (diff >= 0) {
            const dh = Math.floor(diff / (1000 * 60 * 60));
            const dm = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const ds = Math.floor((diff % (1000 * 60)) / 1000);
            durasiHtml = `${dh.toString().padStart(2, '0')}h ${dm.toString().padStart(2, '0')}m ${ds.toString().padStart(2, '0')}s`;
          }
        }
        
        html += `
          <tr style="border-bottom:1px solid #eee;">
            <td style="padding: 10px;">${index++}</td>
            <td style="padding: 10px;">${h.waktuPinjam}</td>
            <td style="padding: 10px;">${h.waktuKembali}</td>
            <td style="padding: 10px;">${durasiHtml}</td>
            <td style="padding: 10px; color:var(--primary-color);">${odcName}</td>
            <td style="padding: 10px;">${h.kegiatan}</td>
            <td style="padding: 10px;">${h.user}</td>
            <td style="padding: 10px; font-size:12px;">
              ${h.selfiePinjam ? `<a href="${h.selfiePinjam}" target="_blank" style="color:var(--primary-color); text-decoration:none;">📷 Selfie P.</a>` : ''}
              ${h.selfieKembali ? `<br><a href="${h.selfieKembali}" target="_blank" style="color:var(--primary-color); text-decoration:none;">📷 Selfie K.</a>` : ''}
              ${h.dasarEvidence ? `<br><a href="${h.dasarEvidence}" target="_blank" style="color:var(--primary-color); text-decoration:none;">📄 Evidence</a>` : ''}
            </td>
          </tr>
        `;
      });
      
      tbody.innerHTML = html;
    }

    function closeModal() {
      document.getElementById('historyModal').style.display = 'none';
    }

    setInterval(() => {
      if(document.getElementById('historyModal').style.display !== 'block') {
         fetchDashboardData();
      }
    }, 30000);
  </script>
</body>
</html>

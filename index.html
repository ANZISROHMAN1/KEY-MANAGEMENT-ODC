<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - ODC</title>
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
</head>
<body>
  <div class="header">
    <h1>Admin Dashboard - ODC</h1>
    <button class="theme-toggle" onclick="toggleTheme()" title="Toggle Dark/Light Mode">🌙</button>
  </div>
  
  <div class="container">
    <div id="loader" class="loader"></div>
    <div id="dashboard" class="dashboard-grid" style="display:none;">
      <!-- STO Cards will be injected here -->
    </div>
    
    <div id="activeBorrowingsSection" style="display:none; margin-top: 40px; background: var(--card-bg); padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
      <h2 style="margin-top:0; border-bottom: 2px solid var(--border-color); padding-bottom: 10px;">REPOSITORY ACTIVITY</h2>
      <div style="overflow-x: auto;">
        <table style="width: 100%; border-collapse: collapse; text-align: left;">
          <thead>
            <tr style="background: #f5f5f5; border-bottom: 2px solid #ddd;">
              <th style="padding: 10px;">STO</th>
              <th style="padding: 10px;">ODC</th>
              <th style="padding: 10px;">Teknisi</th>
              <th style="padding: 10px;">Kegiatan</th>
              <th style="padding: 10px;">Waktu Pinjam</th>
              <th style="padding: 10px;">Estimasi</th>
            </tr>
          </thead>
          <tbody id="activeBorrowingsTableBody">
            <!-- Active rows injected here -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- History Modal -->
  <div id="historyModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <h2 id="modalTitle">History Kunci</h2>
      <div id="modalBody">
        <!-- History details injected here -->
      </div>
    </div>
  </div>

  <script>
    // Theme logic
    const currentTheme = localStorage.getItem('theme') || 'light';
    if (currentTheme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');

    function toggleTheme() {
      let theme = document.documentElement.getAttribute('data-theme');
      theme = (theme === 'dark') ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('theme', theme);
      updateThemeIcon(theme);
    }
    
    function updateThemeIcon(theme) {
      const btn = document.querySelector('.theme-toggle');
      if (btn) btn.innerText = theme === 'dark' ? '☀️' : '🌙';
    }
    
    document.addEventListener("DOMContentLoaded", function() {
      updateThemeIcon(currentTheme);
      fetchDashboardData();
    });

    async function fetchDashboardData() {
      try {
        const response = await fetch(API_URL + '?action=getDashboardData');
        const data = await response.json();
        renderDashboard(data);
      } catch (err) {
        console.error('Error fetching dashboard:', err);
        const dashboard = document.getElementById('dashboard');
        if (dashboard.innerHTML.trim() === '') {
          document.getElementById('loader').style.display = 'none';
          dashboard.style.display = 'block';
          dashboard.innerHTML = '<div style="text-align:center; padding: 30px; color: var(--red-status);">Gagal terhubung ke database Google Sheets.<br>Mencoba ulang dalam 5 detik...</div>';
          setTimeout(fetchDashboardData, 5000);
        }
      }
    }

    function renderDashboard(data) {
      document.getElementById('loader').style.display = 'none';
      const dashboard = document.getElementById('dashboard');
      dashboard.style.display = 'grid';
      dashboard.innerHTML = '';
      
      let activeBorrowingsList = [];
      
      for (const stoName in data) {
        const sto = data[stoName];
        const card = document.createElement('div');
        card.className = `sto-card status-${sto.status}`;
        
        let odcHtml = '';
        sto.odcs.forEach(odc => {
          let icon = odc.status === 'red' ? '🔒' : '🔓';
          let borrowData = odc.borrowDetails ? JSON.stringify(odc.borrowDetails) : '{}';
          
          if (odc.status === 'red' && odc.borrowDetails) {
            activeBorrowingsList.push(odc.borrowDetails);
          }
          
          odcHtml += `
            <div class="odc-item status-${odc.status}" onclick="handleOdcClick(event, '${odc.name}', '${odc.status}', '${btoa(borrowData)}')">
              <div class="padlock-icon">${icon}</div>
              <div>${odc.name}</div>
            </div>
          `;
        });

        card.innerHTML = `
          <h2>${sto.name}</h2>
          <div style="text-align:center; font-size:12px; color:#666;">Klik untuk melihat ODC</div>
          <div class="odc-list">
            ${odcHtml}
          </div>
        `;
        
        card.onclick = function() {
          this.classList.toggle('expanded');
        };
        
        dashboard.appendChild(card);
      }
      
      // Render active borrowings table
      const tableBody = document.getElementById('activeBorrowingsTableBody');
      const activeSection = document.getElementById('activeBorrowingsSection');
      tableBody.innerHTML = '';
      
      if (activeBorrowingsList.length > 0) {
        activeSection.style.display = 'block';
        activeBorrowingsList.forEach(b => {
          const row = document.createElement('tr');
          row.style.borderBottom = '1px solid #eee';
          row.innerHTML = `
            <td style="padding: 10px;"><strong>${b.sto}</strong></td>
            <td style="padding: 10px;">${b.odc}</td>
            <td style="padding: 10px;">${b.user}</td>
            <td style="padding: 10px;">${b.kegiatan}</td>
            <td style="padding: 10px;">${b.waktuPinjam}</td>
            <td style="padding: 10px;">${b.estimasi} Jam</td>
          `;
          tableBody.appendChild(row);
        });
      } else {
        activeSection.style.display = 'block';
        tableBody.innerHTML = '<tr><td colspan="6" style="padding: 10px; text-align:center; color:#666;">Tidak ada kunci yang sedang dipinjam saat ini.</td></tr>';
      }
    }

    async function handleOdcClick(event, odcName, status, borrowDataStr) {
      event.stopPropagation(); // Prevent STO card from toggling
      
      const modal = document.getElementById('historyModal');
      const modalTitle = document.getElementById('modalTitle');
      const modalBody = document.getElementById('modalBody');
      
      modalTitle.innerText = `Detail Kunci: ${odcName}`;
      modalBody.innerHTML = '<div class="loader"></div>';
      modal.style.display = 'block';
      
      if (status === 'red') {
        const borrowData = JSON.parse(atob(borrowDataStr));
        
        let html = `
          <div style="background:#ffebee; padding:15px; border-radius:8px; margin-bottom:15px;">
            <h3 style="color:red; margin-top:0;">Sedang Dipinjam</h3>
            <p><strong>Teknisi:</strong> ${borrowData.user}</p>
            <p><strong>Kegiatan:</strong> ${borrowData.kegiatan}</p>
            <p><strong>Waktu Pinjam:</strong> ${borrowData.waktuPinjam}</p>
            <p><strong>Estimasi:</strong> ${borrowData.estimasi} Jam</p>
            ${borrowData.selfiePinjam ? `<p><a href="${borrowData.selfiePinjam}" target="_blank" style="color:var(--primary-color);">Lihat Foto Selfie</a></p>` : ''}
          </div>
          <hr>
          <h3>Riwayat Sebelumnya</h3>
          <div id="historyList"><div class="loader"></div></div>
        `;
        modalBody.innerHTML = html;
        
        fetchHistory(odcName);
      } else {
        fetchHistory(odcName);
      }
    }

    async function fetchHistory(odcName) {
      try {
        const response = await fetch(API_URL + '?action=getOdcHistory&odc=' + encodeURIComponent(odcName));
        const historyList = await response.json();
        renderHistory(historyList);
      } catch (err) {
        document.getElementById('modalBody').innerHTML = '<p>Gagal mengambil riwayat.</p>';
      }
    }

    function renderHistory(historyList) {
      const historyContainer = document.getElementById('historyList') || document.getElementById('modalBody');
      
      if (historyList.length === 0) {
        historyContainer.innerHTML = '<p>Belum ada riwayat peminjaman.</p>';
        return;
      }
      
      let html = '<ul style="list-style-type:none; padding:0;">';
      historyList.forEach(h => {
        html += `
          <li style="border-bottom:1px solid #eee; padding-bottom:10px; margin-bottom:10px;">
            <strong>${h.user}</strong> (${h.kegiatan})<br>
            <small style="color:#666;">Pinjam: ${h.waktuPinjam}</small><br>
            <small style="color:#666;">Kembali: ${h.waktuKembali}</small>
          </li>
        `;
      });
      html += '</ul>';
      historyContainer.innerHTML = html;
    }

    function closeModal() {
      document.getElementById('historyModal').style.display = 'none';
    }

    setInterval(() => {
      if(document.getElementById('historyModal').style.display !== 'block') {
         fetchDashboardData();
      }
    }, 30000);
  </script>
</body>
</html>
